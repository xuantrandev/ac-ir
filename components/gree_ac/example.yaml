# Gree AC IR Climate — Example ESPHome configuration
#
# Hardware connections (example, adjust GPIOs to match your board):
#   IR transmitter: GPIO8  (NPN transistor, OUTPUT, inverted)
#   IR receiver:    GPIO21 (TSOP1838, INPUT_PULLUP, inverted)
#
# Drop this into your ESPHome project:
#   external_components:
#     - source: components/
#       components: [gree_ac]

esphome:
  name: gree-ac-dongle
  friendly_name: Gree AC Dongle

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "YOUR_API_KEY_HERE"

ota:
  - platform: esphome
    password: "YOUR_OTA_PASSWORD_HERE"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [gree_ac]

remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO8
    mode: OUTPUT
    inverted: true
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO21
    mode: INPUT_PULLUP
    inverted: true
  tolerance: 25%
  dump: raw

climate:
  - platform: gree_ac
    id: my_gree_ac
    name: "Gree AC"
    receiver_id: ir_rx
    transmitter_id: ir_tx
