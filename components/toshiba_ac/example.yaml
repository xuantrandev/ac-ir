# ─────────────────────────────────────────────────────────────────────────────
# Example ESPHome configuration for the toshiba_ac custom component
#
# Hardware:
#   ESP32-C3 DevKit
#   IR LED (transmitter) on GPIO20 (open-drain + inverted)
#   IR receiver on GPIO21 (pull-up + inverted, e.g. TSOP4838 / VS1838B)
# ─────────────────────────────────────────────────────────────────────────────

esphome:
  name: toshiba-ac-dongle
  friendly_name: "Toshiba AC Dongle"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ── Load the custom component ─────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: components          # path to the folder containing toshiba_ac/
    components: [toshiba_ac]

# ── IR hardware ───────────────────────────────────────────────────────────────
remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO20
    mode: OUTPUT_OPEN_DRAIN
    inverted: true
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO21
    mode: INPUT_PULLUP
    inverted: true
  # 50% timing tolerance handles variation between remotes
  tolerance: 50%
  # Optional: dump raw timings to the log for debugging
  dump: raw

# ── Toshiba AC climate entity ─────────────────────────────────────────────────
climate:
  - platform: toshiba_ac
    name: "Toshiba AC"
    id: my_ac
    receiver_id: ir_rx
    transmitter_id: ir_tx

# ─────────────────────────────────────────────────────────────────────────────
# Supported modes:
#   Mode:  off / auto / cool / heat / dry / fan_only
#   Fan:   auto / low / middle / medium / high
#   Swing: off / vertical
#   Temp:  17–30 °C (1 °C steps)
#
# Notes:
#  • Dry mode ignores the fan setting (AC always uses auto fan in dry mode).
#  • Swing state is maintained by the AC unit between commands; only a change
#    in swing triggers a 7-byte swing IR packet.
#  • "heat" mode and "auto" mode are inferred from protocol structure and have
#    NOT been verified with physical hardware captures.
#  • "swing off" byte (0x41) is inferred; only "swing on" (0x21) was captured.
# ─────────────────────────────────────────────────────────────────────────────

# ── Optional extras ───────────────────────────────────────────────────────────
logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "toshiba-ac-fallback"

captive_portal:

api:

ota:
  - platform: esphome
    password: !secret ota_password
